    <title>FRONTEIRA CUTELARIA | Catálogo Premium</title>
    <script>
      // Clear stale service worker caches on startup to guarantee real-time Firestore sync
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            if (name === 'cutelaria-v1' || name === 'cutelaria-v2') {
              caches.delete(name);
            }
          }
        });
      }
    </script>
